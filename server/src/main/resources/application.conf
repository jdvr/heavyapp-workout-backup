ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [ dev.juanvega.ApplicationKt.rootModule ]
    }
}

heavyapp {
    # Path to the workout export CSV. Set here, via HEAVYAPP_DATA_FILE,
    # or via the -P:heavyapp.dataFile=... command-line tag.
    dataFile = ${?HEAVYAPP_DATA_FILE}
    refreshSeconds = 60
}
